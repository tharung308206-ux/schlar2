  <style id="theme-styles">
    
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --primary-border: #bfdbfe;
      --primary-dark: #1e40af;
      --primary-ring: rgba(37, 99, 235, 0.2);
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Theme color utility overrides */
    .bg-theme-primary { background-color: var(--primary) !important; }
    .bg-theme-primary:hover { background-color: var(--primary-hover) !important; }
    .bg-theme-light { background-color: var(--primary-light) !important; }
    .text-theme-primary { color: var(--primary) !important; }
    .text-theme-dark { color: var(--primary-dark) !important; }
    .border-theme-primary { border-color: var(--primary) !important; }
    .border-theme-border { border-color: var(--primary-border) !important; }
    .ring-theme { box-shadow: 0 0 0 3px var(--primary-ring) !important; }
    
    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    /* Collapsed sidebar tooltips */
    .has-tooltip { position: relative; }
    .has-tooltip .tooltip-text {
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.15s ease-in-out;
      position: absolute;
      left: calc(100% + 8px);
      top: 50%;
      transform: translateY(-50%);
      z-index: 50;
      white-space: nowrap;
    }
    .has-tooltip:hover .tooltip-text {
      visibility: visible;
      opacity: 1;
    }
  
  </style>

    const STORAGE_KEY = 'educore_standalone_v4';

    // Global application state
    let state = loadState();

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (!parsed.screen) parsed.screen = 'welcome';
          return parsed;
        }
      } catch (e) {
        console.error('Error loading state from localStorage:', e);
      }
      const initial = JSON.parse(JSON.stringify(INITIAL_STATE));
      initial.screen = 'welcome';
      return initial;
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error('Error saving state to localStorage:', e);
      }
    }

    function resetDemoData() {
      state = JSON.parse(JSON.stringify(INITIAL_DATA));
      state.screen = 'app';
      saveState();
      applyTheme(state.theme || 'blue');
      closeModal();
      showToast('Demo Data Restored', 'All original Greenfield International School records have been reset.');
      renderApp();
    }

    function applyTheme(themeKey) {
      state.theme = themeKey;
      saveState();
      const theme = THEME_DEFS[themeKey] || THEME_DEFS.blue;
      const root = document.documentElement;
      root.style.setProperty('--primary', theme.hex);
      root.style.setProperty('--primary-hover', theme.hover);
      root.style.setProperty('--primary-light', theme.light);
      root.style.setProperty('--primary-border', theme.border);
      root.style.setProperty('--primary-dark', theme.dark);
      root.style.setProperty('--primary-ring', theme.ring);
    }

    function icon(name) {
      return ICONS[name] || '';
    }

    function showToast(title, message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const colorClass = type === 'error' ? 'border-rose-300 bg-rose-50 text-rose-900 shadow-rose-100' :
                         type === 'info' ? 'border-sky-300 bg-sky-50 text-sky-900 shadow-sky-100' :
                         'border-emerald-300 bg-emerald-50 text-emerald-900 shadow-emerald-100';
      toast.className = 'flex items-start gap-3 p-4 rounded-xl border shadow-xl transition-all duration-300 transform translate-y-2 opacity-0 ' + colorClass;
      toast.innerHTML = `
        <div class="flex-1">
          <h4 class="font-bold text-sm">${title}</h4>
          <p class="text-xs mt-0.5 opacity-90">${message}</p>
        </div>
        <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-slate-700 text-lg leading-none font-bold">&times;</button>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      }, 10);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    function openModal(html) {
      const container = document.getElementById('modal-container');
      container.innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm" onclick="if(event.target === this) closeModal()">
          <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden">
            ${html}
          </div>
        </div>
      `;
    }

    function closeModal() {
      const container = document.getElementById('modal-container');
      if (container) container.innerHTML = '';
    }

    // Navigation and screen switching
    function setScreen(screenName) {
      state.screen = screenName;
      saveState();
      renderApp();
    }

    function selectPlatform(platform) {
      state.currentPlatform = platform;
      state.currentRole = platform === 'web' ? 'principal' : 'parent_mobile';
      state.activeTab = 'dashboard';
      state.screen = 'role_select';
      saveState();
      renderApp();
    }

    function selectRole(role) {
      state.currentRole = role;
      state.activeTab = 'dashboard';
      saveState();
      renderApp();
    }

    function switchTheme(themeKey) {
      applyTheme(themeKey);
      renderApp();
    }

    function enterApplication() {
      state.screen = 'app';
      state.activeTab = 'dashboard';
      saveState();
      renderApp();
    }

    function signOut() {
      state.screen = 'welcome';
      saveState();
      renderApp();
      showToast('Signed Out', 'Returned to SCHLAR portal.');
    }

    function switchRole() {
      state.screen = 'role_select';
      saveState();
      renderApp();
    }

    function toggleSidebar() {
      state.sidebarCollapsed = !state.sidebarCollapsed;
      saveState();
      renderApp();
    }

    function setActiveTab(tab) {
      state.activeTab = tab;
      saveState();
      renderApp();
    }

    function selectChild(childId) {
      state.selectedChild = childId;
      saveState();
      renderApp();
      const child = state.children[childId];
      if (child) {
        showToast('Child Profile Switched', 'Now viewing records for ' + child.name + ' (' + child.grade + ')');
      }
    }

    // Add Student
    function handleAddStudent(event) {
      event.preventDefault();

      const newStudent = {
        id: 's-' + Date.now(),
        name: formData.get('name').trim(),
        admissionId: formData.get('admissionId').trim(),
        className: formData.get('className'),
        rollNo: formData.get('rollNo').trim(),
        parentName: formData.get('parentName').trim(),
        parentPhone: formData.get('parentPhone').trim(),
        gender: formData.get('gender') || 'Male',
        bloodGroup: formData.get('bloodGroup') || 'O+',
        attendanceRate: 95.0,
        academicStatus: 'Good',
        status: 'Active',
        dob: '2011-01-01',
        address: 'Bengaluru, India'
      };

      state.students.unshift(newStudent);
      
      // Also add fee record for the student
      state.fees.unshift({
        studentId: newStudent.id,
        name: newStudent.name,
        className: newStudent.className,
        totalFee: 150000,
        paid: 0,
        pending: 150000,
        dueDate: '2026-10-30',
        status: 'Pending',
        parent: newStudent.parentName
      });

      saveState();
      closeModal();
      showToast('Student Added Successfully', `${newStudent.name} enrolled into ${newStudent.className}.`);
      renderApp();
    }

    // Edit Student
    function handleEditStudent(event, id) {
      event.preventDefault();
      const form = event.target;
      const formData = new FormData(form);
      const student = state.students.find(s => s.id === id);
      if (!student) return;

      student.name = formData.get('name').trim();
      student.className = formData.get('className');
      student.rollNo = formData.get('rollNo').trim();
      student.parentName = formData.get('parentName').trim();
      student.parentPhone = formData.get('parentPhone').trim();
      student.status = formData.get('status') || 'Active';

      // Update in fees as well
      const fee = state.fees.find(f => f.studentId === id);
      if (fee) {
        fee.name = student.name;
        fee.className = student.className;
        fee.parent = student.parentName;
      }

      saveState();
      closeModal();
      showToast('Student Updated', `Record for ${student.name} saved successfully.`);
      renderApp();
    }

    function handleDeleteStudent(id) {
      const student = state.students.find(s => s.id === id);

    }

    // Record Payment
    function handleRecordPayment(event) {
      event.preventDefault();
      const form = event.target;
      const formData = new FormData(form);
      const studentId = formData.get('studentId');
      const amount = parseInt(formData.get('amount'), 10);
      const method = formData.get('method');
      const refNo = formData.get('refNo');
      const date = formData.get('date');

      const student = state.students.find(s => s.id === studentId);
      const fee = state.fees.find(f => f.studentId === studentId);

      if (!student || !fee) return;

      // Update fee balances
      fee.paid += amount;
      fee.pending = Math.max(0, fee.totalFee - fee.paid);
      fee.status = fee.pending === 0 ? 'Paid' : 'Partial';

      const receiptNo = 'RCP-2026-' + Math.floor(1000 + Math.random() * 9000);
      const newPayment = {
        receiptNo,
        studentId: student.id,
        studentName: student.name,
        className: student.className,
        amount,
        date,
        method,
        refNo,
        cashier: state.profiles.accountant.name
      };

      state.payments.unshift(newPayment);
      saveState();
      closeModal();
      showToast('Payment Recorded Successfully', `₹${amount.toLocaleString()} received via ${method} for ${student.name}.`);
      renderApp();
      // Automatically pop up official receipt
      setTimeout(() => openReceiptModal(receiptNo), 400);
    }

    // Issue Book
    function handleIssueBook(event) {
      event.preventDefault();
      const form = event.target;
      const formData = new FormData(form);
      const bookId = formData.get('bookId');
      const studentId = formData.get('studentId');
      const dueDate = formData.get('dueDate');

      const book = state.books.find(b => b.id === bookId);
      const student = state.students.find(s => s.id === studentId);

      if (!book || !student) return;
      if (book.availableCopies <= 0) {
        showToast('Out of Stock', 'No copies available for issue at this time.', 'error');
        return;
      }

      // Decrement copies
      book.availableCopies -= 1;
      if (book.availableCopies === 0) book.status = 'Out of Stock';

      // Create transaction
      const tx = {
        id: 'tx-' + Date.now(),
        bookId: book.id,
        bookTitle: book.title,
        studentId: student.id,
        studentName: student.name,
        className: student.className,
        issueDate: new Date().toISOString().split('T')[0],
        dueDate: dueDate,
        returnDate: null,
        status: 'Issued',
        fine: 0
      };

      state.libraryTransactions.unshift(tx);
      saveState();
      closeModal();
      showToast('Book Issued Successfully', `"${book.title}" checked out to ${student.name}. Available: ${book.availableCopies}`);
      renderApp();
    }

    // Return Book
    function handleReturnBook(txId) {
      const tx = state.libraryTransactions.find(t => t.id === txId);
      if (!tx || tx.status === 'Returned') return;

      const book = state.books.find(b => b.id === tx.bookId);
      if (book) {
        book.availableCopies += 1;
        book.status = 'Available';
      }

      tx.returnDate = new Date().toISOString().split('T')[0];
      tx.status = 'Returned';

      saveState();
      showToast('Book Returned', `"${tx.bookTitle}" returned by ${tx.studentName}. Stock restored.`);
      renderApp();
    }

    // Create Assignment
    function handleCreateAssignment(event) {
      event.preventDefault();
      const form = event.target;
      const formData = new FormData(form);

      const asg = {
        id: 'a-' + Date.now(),
        title: formData.get('title').trim(),
        className: formData.get('className'),
        subject: formData.get('subject').trim(),
        teacher: state.profiles.teacher.name,
        dueDate: formData.get('dueDate'),
        status: 'Active',
        description: formData.get('description'),
        submissions: 0,
        total: 35
      };

      state.assignments.unshift(asg);
      saveState();
      closeModal();
      showToast('Assignment Published', `"${asg.title}" assigned to ${asg.className}.`);
      renderApp();
    }

    // Delete Assignment
    function handleDeleteAssignment(id) {
      const asg = state.assignments.find(a => a.id === id);
      if (!asg) return;
      if (confirm(`Delete assignment "${asg.title}"?`)) {
        state.assignments = state.assignments.filter(a => a.id !== id);
        saveState();
        showToast('Assignment Deleted', `"${asg.title}" was removed.`, 'info');
        renderApp();
      }
    }

    // Send Parent Message
    function handleSendParentMessage(event) {
      event.preventDefault();
      const input = document.getElementById('parent-chat-input');
      const text = input ? input.value.trim() : '';
      if (!text) return;

      const now = new Date();
      const timeStr = 'Today ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      state.messages.push({
        id: 'm-' + Date.now(),
        sender: 'Sunita Sharma (Parent)',
        senderRole: 'Parent',
        text: text,
        time: timeStr
      });

      if (input) input.value = '';
      saveState();
      showToast('Message Sent', 'Your message has been delivered to Dr. Vikram Sharma.');
      renderApp();
    }

    // Dynamic Module Content Dispatcher
    function renderModuleContent() {
      const tab = state.activeTab;
      const role = state.currentRole;

      if (tab === 'settings') return renderSettingsView();
      if (tab === 'profile') return renderProfileView();

      if (role === 'principal') {
        if (tab === 'dashboard') return renderPrincipalDashboard();
        if (tab === 'students') return renderStudentsModule();
        if (tab === 'teachers') return renderTeachersModule();
        if (tab === 'staff') return renderStaffModule();
        if (tab === 'classes') return renderClassesModule();
        if (tab === 'attendance') return renderAttendanceModule();
        if (tab === 'timetable') return renderTimetableModule();
        if (tab === 'exams') return renderExamsModule();
        if (tab === 'assignments') return renderAssignmentsModule();
        if (tab === 'notices') return renderNoticesModule();
        if (tab === 'finance') return renderFinanceModule();
        if (tab === 'reports') return renderReportsModule();
      }

      if (role === 'vice_principal') {
        if (tab === 'dashboard') return renderVicePrincipalDashboard();
        if (tab === 'classes') return renderClassesModule();
        if (tab === 'teachers') return renderTeachersModule();
        if (tab === 'attendance') return renderAttendanceModule();
        if (tab === 'exams') return renderExamsModule();
        if (tab === 'marks') return renderMarksModule();
        if (tab === 'assignments') return renderAssignmentsModule();
        if (tab === 'timetable') return renderTimetableModule();
        if (tab === 'notices') return renderNoticesModule();
        if (tab === 'reports') return renderReportsModule();
      }

      if (role === 'teacher') {
        if (tab === 'dashboard') return renderTeacherDashboard();
        if (tab === 'my_classes') return renderTeacherMyClasses();
        if (tab === 'students') return renderTeacherStudents();
        if (tab === 'attendance') return renderTeacherAttendanceRollCall();
        if (tab === 'marks') return renderMarksModule();
        if (tab === 'assignments') return renderAssignmentsModule();
        if (tab === 'timetable') return renderTimetableModule();
        if (tab === 'exams') return renderExamsModule();
        if (tab === 'notices') return renderNoticesModule();
      }

      if (role === 'accountant') {
        if (tab === 'dashboard') return renderAccountantDashboard();
        if (tab === 'fees') return renderFeesModule();
        if (tab === 'collections') return renderCollectionsModule();
        if (tab === 'receipts') return renderReceiptsModule();
        if (tab === 'reports') return renderFinanceReportsModule();
      }

      if (role === 'receptionist') {
        if (tab === 'dashboard') return renderReceptionistDashboard();
        if (tab === 'visitors') return renderVisitorsModule();
        if (tab === 'admissions') return renderAdmissionsPipelineModule();
        if (tab === 'appointments') return renderAppointmentsModule();
        if (tab === 'students') return renderStudentsModule(true);
        if (tab === 'notices') return renderNoticesModule();
      }

      if (role === 'librarian') {
        if (tab === 'dashboard') return renderLibrarianDashboard();
        if (tab === 'books') return renderBooksModule();
        if (tab === 'issue_return') return renderIssueReturnModule();
        if (tab === 'fines') return renderFinesModule();
        if (tab === 'reports') return renderLibraryReportsModule();
      }

      // Default fallback view
      return renderPrincipalDashboard();
    }

    function filterStudentsTable(term) {
      const q = term.toLowerCase();
      document.querySelectorAll('#students-table .student-row').forEach(row => {
        const name = row.getAttribute('data-name') || '';
        const id = row.getAttribute('data-id') || '';
        const cls = row.getAttribute('data-class') || '';
        row.style.display = (name.includes(q) || id.includes(q) || cls.toLowerCase().includes(q)) ? '' : 'none';
      });

      document.querySelectorAll('#students-table .student-row').forEach(row => {

          <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 px-1">Selected Ward Profile</div>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="selectChild('aarav')" class="p-2 rounded-xl text-left border transition-all ${childKey === 'aarav' ? 'bg-theme-light border-theme-primary ring-1 ring-theme' : 'border-slate-100 hover:bg-slate-50'}">
              <span class="font-bold text-xs text-slate-900 block truncate">Aarav Sharma</span>
              <span class="text-[10px] text-slate-500">Grade 8A · Roll 12</span>
            </button>
            <button onclick="selectChild('ananya')" class="p-2 rounded-xl text-left border transition-all ${childKey === 'ananya' ? 'bg-theme-light border-theme-primary ring-1 ring-theme' : 'border-slate-100 hover:bg-slate-50'}">
              <span class="font-bold text-xs text-slate-900 block truncate">Ananya Sharma</span>
              <span class="text-[10px] text-slate-500">Grade 5B · Roll 06</span>
            </button>
          </div>
        </div>
      `;

      if (tab === 'chat') {
        return `
          ${switcherHtml}
          <div class="flex flex-col h-[520px]">
            <div class="flex items-center gap-2 pb-2 mb-2 border-b border-slate-200">
              <div class="w-8 h-8 rounded-full bg-theme-primary text-white font-bold flex items-center justify-center text-xs">VS</div>
              <div>
                <h4 class="font-bold text-xs text-slate-900">Dr. Vikram Sharma</h4>
                <p class="text-[10px] text-slate-400">Class Teacher (${child.grade})</p>
              </div>
            </div>

            <!-- Messages Stream -->
            <div class="flex-1 overflow-y-auto space-y-2.5 pr-1">
              ${state.messages.map(m => `
                <div class="flex flex-col ${m.senderRole === 'Parent' ? 'items-end' : 'items-start'}">
                  <div class="p-2.5 rounded-2xl max-w-[85%] text-xs ${m.senderRole === 'Parent' ? 'bg-theme-primary text-white rounded-br-none shadow-xs' : 'bg-white border border-slate-200 text-slate-800 rounded-bl-none shadow-xs'}">
                    <p>${m.text}</p>
                  </div>
                  <span class="text-[9px] text-slate-400 mt-0.5 px-1 font-mono">${m.time}</span>
                </div>
              `).join('')}
            </div>

            <!-- Input Form -->
            <form onsubmit="handleSendParentMessage(event)" class="mt-2 pt-2 border-t border-slate-200 flex gap-1.5">
              <input type="text" id="parent-chat-input" required placeholder="Type message to class teacher..." class="flex-1 px-3 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:border-theme-primary bg-white">
              <button type="submit" class="px-3 py-2 bg-theme-primary text-white text-xs font-bold rounded-xl shadow-xs">
                Send
              </button>
            </form>
          </div>
        `;
      }

      if (tab === 'fees') {
        return `
          ${switcherHtml}
          <div class="space-y-3">
            <div class="p-4 bg-white rounded-2xl border border-slate-200 shadow-xs space-y-2">
              <div class="flex justify-between items-center">
                <span class="text-xs text-slate-400 font-semibold">Tuition Status</span>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">${child.feeStatus}</span>
              </div>
              <div class="text-xl font-extrabold text-slate-900">
                ${child.pendingFee === 0 ? '₹0 Pending' : '₹' + child.pendingFee.toLocaleString() + ' Due'}
              </div>
              <p class="text-[11px] text-slate-500">AY 2026–2027 Term 1 & 2 Dues</p>
            </div>

            <div class="p-4 bg-white rounded-2xl border border-slate-200 shadow-xs space-y-2">
              <h5 class="font-bold text-xs text-slate-800">Recent Payment Receipts</h5>
              <div class="divide-y divide-slate-100">
                <div class="py-2 flex items-center justify-between text-xs">
                  <div>
                    <strong class="font-mono text-slate-800">RCP-2026-1044</strong>
                    <span class="block text-[10px] text-slate-400">Sep 15, 2026 · UPI</span>
                  </div>
                  <button onclick="openReceiptModal('RCP-2026-1044')" class="px-2.5 py-1 rounded-lg border border-slate-200 text-[11px] font-semibold text-slate-700 hover:bg-slate-50">
                    Receipt
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // Default: Parent Overview Tab
      return `
        ${switcherHtml}
        <div class="space-y-3">
          <!-- Child Snapshot Card -->
          <div class="bg-gradient-to-r from-slate-900 to-slate-800 text-white p-4 rounded-2xl shadow-md flex items-center justify-between">
            <div>
              <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider block">Student Dashboard</span>
              <h4 class="text-base font-extrabold mt-0.5">${child.name}</h4>
              <p class="text-xs text-slate-400">${child.grade} · Admission ID: ${child.admissionId}</p>
            </div>
            <div class="text-center">
              <span class="text-xl font-extrabold text-emerald-400 block">${child.attendanceRate}%</span>
              <span class="text-[10px] text-slate-400">Attendance</span>
            </div>
          </div>

          <!-- Academic Performance Pills -->
          <div class="p-3.5 bg-white rounded-2xl border border-slate-200 shadow-xs space-y-2">
            <h5 class="text-xs font-bold text-slate-800">Recent Term 1 Subject Scores</h5>
            <div class="space-y-1.5">
              ${child.recentMarks.map(m => `
                <div class="flex items-center justify-between text-xs">
                  <span class="text-slate-600 font-medium">${m.subject}</span>
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-slate-900">${m.score}</span>
                    <span class="text-[10px] font-bold px-1.5 py-0.2 rounded bg-emerald-50 text-emerald-700">${m.grade}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Quick Actions -->
          <div class="grid grid-cols-2 gap-2">
            <button onclick="setActiveTab('chat')" class="p-3 bg-white rounded-xl border border-slate-200 text-left hover:border-theme-primary shadow-xs">
              <span class="block text-xs font-bold text-slate-800">Chat Teacher</span>
              <span class="text-[10px] text-slate-400">Dr. Vikram Sharma</span>
            </button>
            <button onclick="setActiveTab('fees')" class="p-3 bg-white rounded-xl border border-slate-200 text-left hover:border-theme-primary shadow-xs">
              <span class="block text-xs font-bold text-slate-800">Fee Status</span>
              <span class="text-[10px] text-emerald-600 font-bold">${child.feeStatus}</span>
            </button>
          </div>
        </div>
      `;
    }
  

    // Global Root Dispatcher
    function renderApp() {
      const root = document.getElementById('app');
      if (!root) return;

      if (state.screen === 'welcome') {
        root.innerHTML = renderWelcomeScreen();
      } else if (state.screen === 'role_select') {
        root.innerHTML = renderRoleSelectScreen();
      } else if (state.currentPlatform === 'mobile' || state.currentRole === 'teacher_mobile' || state.currentRole === 'parent_mobile' || state.currentRole === 'parent') {
        root.innerHTML = renderMobileApp();
      } else {
        root.innerHTML = renderWebApp();
      }
    }

    // Keyboard shortcuts & DOM Initialization
    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        openQuickSearchModal();
      }
      if (e.key === 'Escape') {
        closeModal();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      applyTheme(state.theme || 'blue');
      renderApp();
    });

    if (document.readyState !== 'loading') {
      applyTheme(state.theme || 'blue');
      renderApp();
    }
  </script>
</body>
</html>
